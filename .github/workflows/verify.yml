name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Test suite
        run: composer test

      - name: Corpus — every case must get the verdict it deserves
        run: php bin/capsule suite

      # The headline claim, asserted in CI: a genuine fix is VERIFIED, and a
      # patch that cannot be proven is refused with the right exit code.
      - name: A genuine fix is VERIFIED (exit 0)
        run: |
          php bin/capsule check \
            --repo=fixtures/shipping \
            --issue=fixtures/shipping/issue.md \
            --test-command="php check.php" \
            --patch=fixtures/shipping/fix.patch

      - name: A decorative patch is UNVERIFIED (exit 1)
        run: |
          set +e
          php bin/capsule check \
            --repo=corpus/decorative \
            --issue=corpus/decorative/issue.md \
            --test-command="php check.php" \
            --patch=corpus/decorative/patch.diff
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: A patch that edits the check is BLOCKED (exit 3)
        run: |
          set +e
          php bin/capsule check \
            --repo=corpus/exam-rewrite \
            --issue=corpus/exam-rewrite/issue.md \
            --test-command="php check.php" \
            --patch=corpus/exam-rewrite/patch.diff
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; exit 1; }

      # The v2 features, asserted rather than described.
      - name: The test command is discovered from repository config
        run: |
          php bin/capsule check \
            --repo=fixtures/shipping \
            --issue=fixtures/shipping/issue.md \
            --auto-discover \
            --patch=fixtures/shipping/fix.patch

      - name: A blast radius over the threshold is BLOCKED (exit 3)
        run: |
          set +e
          php bin/capsule check \
            --repo=fixtures/shipping \
            --issue=fixtures/shipping/issue.md \
            --test-command="php check.php" \
            --patch=fixtures/shipping/fix.patch \
            --max-blast-radius=1
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; exit 1; }

      - name: Blast radius and cost are reported in the evidence
        run: |
          php bin/capsule check \
            --repo=fixtures/shipping \
            --issue=fixtures/shipping/issue.md \
            --test-command="php check.php" \
            --patch=fixtures/shipping/fix.patch \
            --json > evidence.json
          php -r '
            $e = json_decode(file_get_contents("evidence.json"), true, 512, JSON_THROW_ON_ERROR);
            assert("VERIFIED" === $e["verdict"]);
            assert(3 === $e["blastRadius"]["totalConsumers"]);
            assert(array_key_exists("cost", $e));
            assert(array_key_exists("wallTime", $e));
            assert($e["wallTime"] > 0);
            echo "evidence shape ok\n";
          '

      - name: The repository under verification is never modified
        run: git diff --exit-code
